<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070707"><title>Ahmed Albarudy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--g:#d4af6a;--g2:#f1dfb0;--bg:#070707;--c:#121212;--ln:#d4af6a33}
*{box-sizing:border-box;margin:0}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:#f3efe6;min-height:100vh;padding:18px 16px calc(36px + env(safe-area-inset-bottom));background-image:radial-gradient(500px 300px at 50% 0,#d4af6a1c,transparent)}
.w{max-width:440px;margin:0 auto}
.hero{position:relative;border-radius:34px;overflow:hidden;aspect-ratio:1/1.08;border:1px solid var(--ln);animation:up .7s both}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;filter:contrast(1.05) saturate(.95)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,#070707f2 96%)}
.nm{position:absolute;z-index:2;right:22px;left:22px;bottom:20px}
.nm span{display:inline-block;font-size:12px;letter-spacing:3px;color:var(--g);border:1px solid var(--ln);padding:3px 12px;border-radius:99px;background:#0008;backdrop-filter:blur(6px);margin-bottom:8px}
h1{font-size:36px;line-height:1.05;font-weight:900;direction:ltr;text-align:right;background:linear-gradient(100deg,var(--g2),var(--g) 60%,#a8823f);-webkit-background-clip:text;background-clip:text;color:transparent}
.ar{font-size:15px;color:#cfc7b4;margin-top:4px}
.tel{display:flex;align-items:center;gap:14px;margin-top:14px;padding:16px 18px;border-radius:24px;background:var(--c);border:1px solid var(--ln);color:inherit;text-decoration:none;animation:up .6s .25s both;transition:.25s}
.tel:active{transform:scale(.98)}
.o{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--g);color:var(--g);flex:none}
.tel div{flex:1;line-height:1.3}.tel small{display:block;color:#8d8778;font-size:12px}.tel b{font-size:21px;letter-spacing:1px;direction:ltr;display:block;text-align:right}
.tel em{font-style:normal;background:var(--g);color:#111;font-weight:800;font-size:13px;padding:7px 14px;border-radius:99px}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.t{display:flex;flex-direction:column;gap:3px;padding:18px 16px;border-radius:24px;background:var(--c);border:1px solid var(--ln);color:inherit;text-decoration:none;animation:up .6s var(--d) both;transition:.25s}
.t:hover,.tel:hover{border-color:var(--g);transform:translateY(-3px)}.t:active{transform:scale(.97)}
.t .o{margin-bottom:12px}.t b{font-size:17px}.t small{unicode-bidi:plaintext;text-align:right;color:#8d8778;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv{width:100%;margin-top:14px;padding:16px;border:0;border-radius:24px;font:900 17px Cairo,sans-serif;color:#111;cursor:pointer;background:linear-gradient(100deg,#f1dfb0,#d4af6a);display:flex;align-items:center;justify-content:center;gap:10px;animation:up .6s .75s both}
.f{text-align:center;margin-top:20px;font-size:12px;color:#555}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
</style></head><body><div class="w">
